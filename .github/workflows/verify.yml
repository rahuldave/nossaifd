name: Verify skill package

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A test of the role file needs jlog. With this variable, that test fails instead of skipping when jlog is missing
    env:
      NOSSAIFD_NEED_JLOG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Build jlog, which the step line of the role file needs
        # The commit 6fccbf9 is the tag v0.1.0 of jlog.
        run: cargo install --locked --git https://github.com/rahuldave/jlog --rev 6fccbf92d47a7b66f0e5b4dce7046c25c29a364a jlog
      - name: Check, test and check the prose
        run: just check
      - name: Check the links to skills of other packages with the jnterfaces checker
        run: |
          git clone --quiet https://github.com/rahuldave/jnterfaces "$RUNNER_TEMP/jnterfaces"
          git -C "$RUNNER_TEMP/jnterfaces" checkout --quiet ba6a04be55209a4d20198b5550263e2fc2614784
          just links "$RUNNER_TEMP/jnterfaces"
      - name: Validate package manifest with skill-package-maker
        run: just package-lint
