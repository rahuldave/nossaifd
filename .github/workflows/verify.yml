name: Verify skill package

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A test of the role file needs jlog, and the tests of the example result of just prose need jagt. With these
    # variables, those tests fail instead of skipping when the program is missing
    env:
      NOSSAIFD_NEED_JLOG: '1'
      NOSSAIFD_NEED_JAGT: '1'
      NOSSAIFD_NEED_JNTERFACES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Build jlog, which the step line of the role file needs
        # The commit 6fccbf9 is the tag v0.1.0 of jlog.
        run: cargo install --locked --git https://github.com/rahuldave/jlog --rev 6fccbf92d47a7b66f0e5b4dce7046c25c29a364a jlog
      - name: Build jagt, which lints the example result of just prose
        # The commit 53e72b4 is the tag v0.6.0 of jagt.
        run: cargo install --locked --git https://github.com/rahuldave/jagt --rev 53e72b4ef6361bf0c11110e3e55cba0241cad465 jagt
      - name: Clone jnterfaces, whose lint of steps a test runs on the role file
        # The commit 4bfcb3f is on the main branch of jnterfaces and has scripts/lint_steps.py.
        run: |
          git clone --quiet https://github.com/rahuldave/jnterfaces "$RUNNER_TEMP/jnterfaces-lint"
          git -C "$RUNNER_TEMP/jnterfaces-lint" checkout --quiet 4bfcb3f81f0008990383b51936889d3f5022a426
          echo "JNTERFACES_DIR=$RUNNER_TEMP/jnterfaces-lint" >> "$GITHUB_ENV"
      - name: Check, test and check the prose
        run: just check
      - name: Check the links to skills of other packages with the jnterfaces checker
        run: |
          git clone --quiet https://github.com/rahuldave/jnterfaces "$RUNNER_TEMP/jnterfaces"
          git -C "$RUNNER_TEMP/jnterfaces" checkout --quiet ba6a04be55209a4d20198b5550263e2fc2614784
          just links "$RUNNER_TEMP/jnterfaces"
      - name: Validate package manifest with skill-package-maker
        run: just package-lint
